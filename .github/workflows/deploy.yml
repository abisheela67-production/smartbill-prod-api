name: Deploy API to IIS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish
      run: dotnet publish -c Release -o publish

    - name: Stop IIS site
      run: |
        Import-Module WebAdministration
        Stop-WebSite "smartbillpro-api"

    - name: Copy files to IIS
      run: |
        Remove-Item "C:\inetpub\smartbillpro-api\publish\*" -Recurse -Force
        Copy-Item "publish\*" "C:\inetpub\smartbillpro-api\publish" -Recurse -Force

    - name: Start IIS site
      run: |
        Import-Module WebAdministration
        Start-WebSite "smartbillpro-api"
