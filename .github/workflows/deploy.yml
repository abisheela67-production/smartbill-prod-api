name: Deploy API to IIS (Production)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish
      run: dotnet publish -c Release -o publish

    - name: Stop IIS site
      shell: powershell
      run: |
        Import-Module WebAdministration
        if (Test-Path "IIS:\Sites\SmartBillApiProd") {
          Stop-WebSite "SmartBillApiProd"
        }

    - name: Copy files to IIS
      shell: powershell
      run: |
        $dest = "C:\inetpub\SmartBillApiProd"
        if (!(Test-Path $dest)) {
          New-Item -ItemType Directory -Path $dest
        }

        Remove-Item "$dest\*" -Recurse -Force -ErrorAction SilentlyContinue
        Copy-Item "publish\*" $dest -Recurse -Force

    - name: Start IIS site
      shell: powershell
      run: |
        Import-Module WebAdministration
        Start-WebSite "SmartBillApiProd"
